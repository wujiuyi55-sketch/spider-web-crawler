<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">蛛网 Web Crawler</title>
  <desc id="desc">输入网址，抓取结构化网页数据并导出 JSON 或 CSV。</desc>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#16241d" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9f36b"/>
      <stop offset="1" stop-color="#b8e85a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#16241d" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="620" fill="#f2efe5"/>
  <rect width="1200" height="620" fill="url(#grid)"/>
  <circle cx="1030" cy="120" r="280" fill="#d9f36b" fill-opacity="0.1"/>

  <circle cx="90" cy="54" r="21" fill="#12241b"/>
  <g transform="translate(90 54)" fill="none" stroke="#d9f36b" stroke-width="1.1">
    <circle r="13"/><circle r="8"/><circle r="3"/>
    <path d="M0 -16V16M-16 0H16M-10 -10 10 10M10 -10-10 10"/>
  </g>
  <text x="123" y="50" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#16241d">蛛网</text>
  <text x="123" y="68" font-family="Consolas, monospace" font-size="9" fill="#6e796f" letter-spacing="2">WEB CRAWLER</text>
  <circle cx="1000" cy="53" r="4" fill="#1d7451"/>
  <text x="1012" y="57" font-family="Consolas, monospace" font-size="11" fill="#6e796f">本地运行 · v1.0.0</text>
  <line x1="60" y1="92" x2="1140" y2="92" stroke="#16241d" stroke-opacity="0.12"/>

  <text x="60" y="150" font-family="Consolas, monospace" font-size="10" fill="#6e796f" letter-spacing="2">01  INPUT → CRAWL → EXPORT</text>
  <text x="60" y="230" font-family="Microsoft YaHei, sans-serif" font-size="62" font-weight="800" fill="#16241d" letter-spacing="-3">把网页，变成</text>
  <rect x="58" y="264" width="360" height="26" fill="#d9f36b"/>
  <text x="60" y="295" font-family="Microsoft YaHei, sans-serif" font-size="62" font-weight="800" fill="#16241d" letter-spacing="-3">可用的数据。</text>
  <text x="60" y="345" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#33453b">输入一个网址，选择采集深度。抓取标题、正文、链接、图片与表格，</text>
  <text x="60" y="367" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#33453b">整理成结构化数据，一键导出 JSON 或 CSV。</text>

  <g filter="url(#shadow)"><rect x="60" y="405" width="1080" height="92" rx="18" fill="#fffdf7" stroke="#ddd9cc"/></g>
  <rect x="82" y="425" width="1036" height="52" rx="12" fill="#f8f5eb" stroke="#c5c1b2"/>
  <text x="105" y="457" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#6e796f">https://example.com</text>
  <rect x="1010" y="433" width="96" height="36" rx="8" fill="#14563b"/>
  <text x="1028" y="456" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#fffdf7">开始采集</text>

  <rect x="60" y="525" width="530" height="52" rx="14" fill="#12241b"/>
  <circle cx="88" cy="551" r="14" fill="#193127" stroke="#d9f36b" stroke-opacity="0.4"/>
  <circle cx="88" cy="551" r="3" fill="#d9f36b"/>
  <text x="112" y="548" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#f3f1e6">采集完成，页面数据已就绪</text>
  <text x="112" y="565" font-family="Consolas, monospace" font-size="8.5" fill="#f3f1e6" opacity="0.5">example.com · 1 个页面 · 0.9s</text>
  <rect x="78" y="577" width="492" height="5" rx="3" fill="#d9f36b"/>

  <text x="620" y="548" font-family="Consolas, monospace" font-size="9" fill="#6e796f" letter-spacing="2">03  RESULT</text>
  <text x="620" y="587" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="750" fill="#16241d">采集结果</text>
  <rect x="60" y="592" width="1080" height="1" fill="#ddd9cc"/>
  <text x="620" y="612" font-family="Consolas, monospace" font-size="10" fill="#6e796f">JSON / CSV READY</text>
</svg>
